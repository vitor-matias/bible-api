sonar.organization=vitor-matias
sonar.projectKey=vitor-matias_bible-api

# Tests sit beside the code they cover, so they are carved out of the sources.
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts
sonar.test.inclusions=src/**/*.test.ts

# Written by `npm run test:coverage`, mapped back to src/*.ts through source maps.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
