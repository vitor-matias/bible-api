sonar.organization=vitor-matias
sonar.projectKey=vitor-matias_bible-api

# Tests sit beside the code they cover, so they are carved out of the
# sources, as are the fakes and stubs they share under src/testing.
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/testing/**
sonar.test.inclusions=src/**/*.test.ts,src/testing/**

# Written by `npm run test:coverage`, mapped back to src/*.ts through source maps.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
