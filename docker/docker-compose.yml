services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1G



volumes:
  redis_data:
