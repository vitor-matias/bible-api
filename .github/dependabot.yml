version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 10
    # Minor and patch bumps land in one PR per dependency type; majors stay one
    # PR each so a breaking change is reviewed on its own.
    groups:
      dev-tooling:
        patterns: ["*"]
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        patterns: ["*"]
        dependency-type: production
        update-types: [minor, patch]

  # Workflows pin actions by commit; Dependabot updates the SHA and its comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # No docker ecosystem: docker/docker-compose.yml uses redis-stack:latest,
  # which has no version to bump.
